# ShapeShifter mapping: species token reconciliation (guide recipe 4d)
# Source: current/data/manual_resolutions/species_token_corrections.csv
# (410 pairs; 1 fully-blank row(s) skipped -- ShapeShifter map
# keys can't be empty, and an empty species value has nothing to replace anyway)
#
# HOW TO USE:
# 1. This entity's species column must already be split into one token per row --
#    see guide recipe 4d steps 1-3 (lowercase, strip noise characters, split into
#    species_1/species_2/species_3 columns, then Unnest those columns into one row
#    per token) before this map is useful.
# 2. Because this map has 410 pairs, do NOT try to enter it one row at a time
#    via "Add rule" -- open the entity's YAML tab instead and paste the
#    `replacements:` block below directly. This is still not "programming": you're
#    pasting a list, the same way you'd paste rows into a spreadsheet.
#    (A slower, click-by-click "Add rule" alternative is described in the guide for
#    anyone who prefers it despite the length.)
# 3. Replace `species_split` below with whatever you named the melted token column.
#
# KNOWN LIMITATION -- 4 raw tokens map to MORE THAN ONE canonical species
# in the source data (a single raw word covers two distinct plants/materials). A
# ShapeShifter `map` rule can only produce one output value per input, so these
# 4 rows are mapped to the comma-joined text as-is below, matching the
# source CSV. To fully reproduce the original pipeline's row-splitting behaviour for
# just these rows, repeat the Unnest step from recipe 4d a second time on the
# resulting `manual_species` column (split on comma, then Unnest again) -- the
# original pipeline does exactly this ("re-melt") for the same handful of rows:
#   'bröd- kubbvete' -> 'brödvete, kubbvete'
#   'enmöjl gran' -> 'en,gran'
#   'get alt. svin' -> 'get,svin'
#   'spelt- emmervete' -> 'speltvete, emmervete'

