# ShapeShifter mapping: material string split into components (guide recipe 4e)
# Source: current/data/manual_resolutions/material_manual_resolution.csv (42 raw material
# strings; not every row populates every output column, e.g. most have no 2nd/3rd
# split component -- those simply have fewer pairs below)
#
# HOW TO USE:
# 1. Go to "Extra Columns" and paste the block below -- it duplicates the raw
#    `material` column once per output you need (same "duplicate, then map each
#    duplicate independently" pattern as recipe 4b, since one Replace rule can only
#    rewrite the column it's attached to).
# 2. Go to "Replace" (or the YAML tab) and paste the `replacements:` block below.
# 3. Given how many duplicate columns this needs (12 outputs), pasting via the
#    YAML tab (as with species, recipe 4d) will be far faster than the UI form for
#    all but the smallest of these maps.
# 4. `material_sead_element_*` and `material_sead_modification_type` are element/
#    modification NAMES (e.g. "Bone(s)", "Carbonised"), not database IDs -- matching
#    those names to real SEAD database IDs is a live-database step and is out of
#    scope for this guide (see guide section 6).
#
# Replace `material` below with your entity's actual material column name if it differs.

extra_columns:
  material_split_1_raw: "material"
  material_split_2_raw: "material"
  material_split_3_raw: "material"
  material_english_1_raw: "material"
  material_english_2_raw: "material"
  material_english_3_raw: "material"
  material_modification_raw: "material"
  material_sead_element_1_raw: "material"
